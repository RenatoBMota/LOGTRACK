<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.app_name or 'Monitor' }} - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; }
        .register-box { background: white; padding: 40px; border-radius: 10px; max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .error { color: #dc3545; margin-bottom: 15px; padding: 12px; background: #f8d7da; border-radius: 6px; }
        .success { color: #155724; margin-bottom: 15px; padding: 12px; background: #d4edda; border-radius: 6px; }
        .btn-primary { background: linear-gradient(135deg, #0066CC, #1a8917); border: none; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #0066CC; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>📝 Novo Cadastro</h1>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if success %}<div class="success">{{ success }}</div>{% endif %}
        {% if not success %}
        <form method="POST">
            <input type="text" class="form-control mb-3" name="full_name" placeholder="Nome Completo" required autofocus>
            <input type="email" class="form-control mb-3" name="email" placeholder="Email" required>
            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
        </form>
        {% endif %}
        <div class="back-link">
            Já tem cadastro? <a href="/login">Voltar para login</a>
        </div>
    </div>
</body>
</html>
