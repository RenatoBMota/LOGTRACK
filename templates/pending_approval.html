<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguardando Aprovação</title>
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .pending-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }
        .pending-icon {
            font-size: 5em;
            color: #ffc107;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .pending-container h1 {
            margin: 20px 0;
            color: #333;
            font-weight: 700;
        }
        .pending-container p {
            color: #666;
            margin: 10px 0;
            font-size: 1.05em;
        }
        .btn-logout {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 30px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: #5a6268;
            color: white;
        }
    </style>
</head>
<body>
    <div class="pending-container">
        <i class="fas fa-hourglass-end pending-icon"></i>
        <h1>Conta em Análise</h1>
        <p>Sua conta foi criada com sucesso!</p>
        <p>Aguarde a aprovação do administrador para acessar o sistema.</p>
        <p style="margin-top: 30px; color: #999; font-size: 0.9em;">
            Você receberá uma confirmação quando sua conta for aprovada.
        </p>
        
        <form method="POST" action="{{ url_for('logout') }}" style="display: inline;">
            <button type="submit" class="btn-logout">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </form>
    </div>
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
