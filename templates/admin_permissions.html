{% extends "base.html" %}
{% block content %}
<div style="padding: 20px;">
    <h2>🔐 Permissões por Perfil</h2>
    
    <form method="POST" action="/admin/permissions/update">
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Página</th>
                        {% for role in roles %}
                        <th style="text-align: center;">{{ role }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for page in pages %}
                    <tr>
                        <td><strong>{{ page }}</strong></td>
                        {% for role in roles %}
                        <td style="text-align: center;">
                            <input type="checkbox" name="{{ role }}_{{ page }}" {% if permissions[role][page] %}checked{% endif %}>
                        </td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        
        <button type="submit" class="btn btn-primary">💾 Salvar Permissões</button>
    </form>
</div>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}
