<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha</title>
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; align-items: center; }
        .box { background: white; padding: 40px; border-radius: 10px; max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 30px; color: #333; }
        .error { color: #dc3545; margin-bottom: 15px; padding: 12px; background: #f8d7da; border-radius: 6px; }
        .btn-primary { background: linear-gradient(135deg, #0066CC, #1a8917); border: none; }
        .info { background: #d1ecf1; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔑 Trocar Senha</h1>
        <div class="info">
            <strong>Primeira vez que você acessa?</strong> Crie uma nova senha segura.
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="password" class="form-control mb-3" name="new_password" placeholder="Nova Senha" required autofocus>
            <input type="password" class="form-control mb-3" name="confirm_password" placeholder="Confirmar Senha" required>
            <button type="submit" class="btn btn-primary w-100">Confirmar</button>
        </form>
    </div>
</body>
</html>
